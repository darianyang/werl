# The master WEST configuration file for a simulation.
# vi: set filetype=yaml :
---
west: 
  system:
    # custom WESTsystem
    driver: system.System
    module_path: $WEST_SIM_ROOT
    system_options:
      # Dimensionality of your progress coordinate
      pcoord_ndim: 6
      # Number of data points per iteration
      pcoord_len: 2
      # Data type for your progress coordinate
      pcoord_dtype: !!python/name:numpy.float32

  propagation:
    max_total_iterations:   MAXTOTALITERS
    max_run_wallclock:      24:00:00
    propagator:             synd_propagator.SynMDPropagator
    parameters:
        synd_model: d1d2.synd
    gen_istates: false

  # WE driver options
  drivers:
    # standard H&K
    we_driver: default
    
    # from current odld directory
    #we_driver: werl_driver.WERLDriver
    
  data:
    west_data_file: west-REPLACEWITHVERSION.h5
    aux_compression_threshold: 16384
    datasets:
      # - name: displacement            
      #   h5path: auxdata/displacement 
      #   store: false
      #   load: false
      #   dtype: float32                
      #   compression: false            
      #   scaleoffset: 4                
      #   chunks: null                  
      - name: pcoord                  
        scaleoffset: 4
    data_refs:
      segment:       $WEST_SIM_ROOT/traj_segs/{segment.n_iter:06d}/{segment.seg_id:06d}
      basis_state:   $WEST_SIM_ROOT/bstates/{basis_state.auxref}
      initial_state: $WEST_SIM_ROOT/istates/{initial_state.iter_created}/{initial_state.state_id}.gro

  analysis:
     directory: ANALYSIS
     kinetics:                          
       step_iter: 10
       evolution: cumulative
       #evolution: blocked
       extra: [ 'disable-correl' ]
#     red:
#       scheme: DEFAULT
#       istate_label: start
#       fstate_label: end
#       nstiter: 1
#       nstrep: 1
     analysis_schemes:                  
       REPLACEWITHVERSION:
         enabled: True
         bins:
           - type: RectilinearBinMapper
             boundaries: 
               - ['-inf', 10.0, 'inf']
               - ['-inf', 10.0, 'inf']
               - ['-inf', 5.0, 'inf']
               - ['-inf', 50, 'inf']
               - ['-inf', -95, -45, 'inf']
               - ['-inf', -95, -45, 'inf']
         states:
           - label: d1
             coords: 
               - [40, 40, 15, 55, 170, 170]
               - [40, 40, 15, 55, -170, 170]
               - [40, 40, 15, 55, 170, -170]
               - [40, 40, 15, 55, -170, -170]
           - label: d2
             coords: 
               - [5, 5, 3, 55, -75, -75]
